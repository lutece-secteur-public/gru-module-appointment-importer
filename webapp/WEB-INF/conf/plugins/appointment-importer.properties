daemon.appointmentImportDaemon.interval=30
daemon.appointmentImportDaemon.onstartup=1

daemon.appointmentImportPurgeDaemon.interval=86400
daemon.appointmentImportPurgeDaemon.onstartup=1

appointment-importer.itemsPerPage=10

# Number of days an import keeps its personal data (rows, validation report) before the purge daemon archives it
appointment-importer.purge.retentionDays=90

# Minutes after which a batch still PROCESSING is considered abandoned (the instance stopped) and taken over
appointment-importer.processing.timeoutMinutes=30

# Limits and formats checked on upload
appointment-importer.maxRows=20000
appointment-importer.maxNameLength=100
# Pattern of a phone number once its separators are removed (a leading zero lost by a numeric cell is restored first)
appointment-importer.phonePattern=0[0-9]{9}
# A text field of the form whose title or code (accents removed, lower case, '_' read as a space) contains this pattern only accepts an email
appointment-importer.emailFieldPattern=(^|[ -])(e-?mail|mail|courriel)($|[ -])

# Standard columns: header, other accepted header, and for phoneNumber and birthDate whether the column is mandatory
# Keys: lastName, firstName, email, phoneNumber, date, startingTime, endingTime, birthDate
